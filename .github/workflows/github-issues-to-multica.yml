name: Forward new issues to Multica

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number in HybridRbt/paseo-sync to forward with a fresh run_id'
        required: true
        type: number

permissions: {}

jobs:
  forward:
    if: >-
      github.repository == 'HybridRbt/paseo-sync' &&
      (github.event.action == 'opened' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Forward issue payload
        env:
          MULTICA_WEBHOOK_URL: ${{ secrets.MULTICA_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid

          SAFE_TOKEN_RE = re.compile(r'^[A-Za-z0-9_.:-]{1,64}$')

          def fail(message):
              print(message, file=sys.stderr)
              raise SystemExit(1)

          def safe_token(value):
              return value if isinstance(value, str) and SAFE_TOKEN_RE.match(value) else None

          def safe_uuid(value):
              if not isinstance(value, str):
                  return None
              try:
                  return str(uuid.UUID(value))
              except (ValueError, AttributeError, TypeError):
                  return None

          def format_diagnostics(data):
              if not isinstance(data, dict):
                  return ''
              parts = []
              delivery_id = safe_uuid(data.get('delivery_id'))
              if delivery_id:
                  parts.append(f'delivery_id={delivery_id}')
              reason = safe_token(data.get('reason')) or safe_token(data.get('reason_code'))
              if reason:
                  parts.append(f'reason={reason}')
              event_name = safe_token(data.get('event'))
              if event_name:
                  parts.append(f'event={event_name}')
              return '; '.join(parts)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as source:
              event = json.load(source)
          repository = event.get('repository', {}).get('full_name')
          event_name = os.environ.get('GITHUB_EVENT_NAME')

          if event_name == 'workflow_dispatch':
              if repository != 'HybridRbt/paseo-sync':
                  print('Filtered: not a target repository event')
                  raise SystemExit(0)
              raw_number = (event.get('inputs') or {}).get('issue_number')
              try:
                  issue_number = int(str(raw_number).strip())
              except (TypeError, ValueError):
                  issue_number = 0
              if issue_number <= 0:
                  fail('Missing or invalid workflow_dispatch issue_number; nothing sent')
              issue_headers = {
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'paseo-sync-issue-relay',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              gh_token = os.environ.get('GITHUB_TOKEN', '').strip()
              if gh_token:
                  issue_headers['Authorization'] = f'Bearer {gh_token}'
              issue_req = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/issues/{issue_number}',
                  headers=issue_headers,
                  method='GET',
              )
              try:
                  with urllib.request.build_opener(NoRedirect).open(issue_req, timeout=30) as issue_resp:
                      issue = json.load(issue_resp)
              except urllib.error.HTTPError as error:
                  fail(f'GitHub API HTTP {error.code} while loading issue #{issue_number}; nothing sent')
              except Exception:
                  fail(f'Failed to load issue #{issue_number} from GitHub API; nothing sent')
              if not isinstance(issue, dict) or 'pull_request' in issue:
                  fail(f'Issue #{issue_number} is a pull request or invalid; nothing sent')
          else:
              issue = event.get('issue', {})
              if (event_name != 'issues'
                      or event.get('action') != 'opened'
                      or repository != 'HybridRbt/paseo-sync'
                      or 'pull_request' in issue):
                  print('Filtered: not a target issue opened event')
                  raise SystemExit(0)

          if not isinstance(issue.get('number'), int) or not issue.get('html_url'):
              fail('Missing issue number or URL; nothing sent')

          url = os.environ.get('MULTICA_WEBHOOK_URL', '')
          parts = urllib.parse.urlsplit(url)
          if parts.scheme != 'https' or not parts.netloc or parts.username or parts.password:
              fail('Missing or invalid HTTPS webhook secret; nothing sent')

          run_id = os.environ['GITHUB_RUN_ID']
          delivery_key = f'gh-actions:{repository}:{run_id}'
          # Stable payload and key across attempts of the SAME Actions run.
          # Actions does not provide the original X-GitHub-Delivery here.
          payload = {
              'action': 'opened',
              'repository': {'full_name': repository},
              'issue': {key: issue.get(key) for key in ('number', 'html_url', 'title', 'body')},
              'relay': {'kind': 'github-actions', 'run_id': run_id,
                        'delivery_id': delivery_key},
          }
          request = urllib.request.Request(
              url, data=json.dumps(payload, ensure_ascii=False).encode('utf-8'),
              headers={'Content-Type': 'application/json', 'X-GitHub-Event': 'issues',
                       'Idempotency-Key': delivery_key}, method='POST')

          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              err_detail = ''
              try:
                  err_detail = format_diagnostics(json.load(error))
              except Exception:
                  err_detail = ''
              err_suffix = f' ({err_detail})' if err_detail else ''
              fail(f'HTTP {error.code}{err_suffix}; inspect the existing delivery/run before retrying')
          except Exception:
              # Exception text may contain the credential-bearing URL.
              fail('Transport or response error; inspect existing delivery/run before retrying')

          status = safe_token(result.get('status')) if isinstance(result, dict) else None
          raw_run = result.get('run_id') if isinstance(result, dict) else None
          multica_run = safe_uuid(raw_run)
          diagnostics = format_diagnostics(result)
          diag_suffix = f' ({diagnostics})' if diagnostics else ''

          if status == 'ignored':
              fail(f'Ignored by Multica{diag_suffix}; check trigger status/event filter and replay in Multica or trigger a new run')

          if status == 'duplicate':
              if raw_run is not None and multica_run is None:
                  fail(f'Invalid run identifier{diag_suffix}; inspect the existing delivery before retrying')
              if multica_run:
                  print(f'Multica admission=duplicate; run_id={multica_run}' + (f'; {diagnostics}' if diagnostics else ''))
                  print('Duplicate of an already-admitted delivery for this Actions run; implementation and review are still unverified')
                  raise SystemExit(0)
              fail(f'Duplicate delivery without run_id{diag_suffix}; the initial attempt of this Actions run was not admitted. Replay the delivery in Multica or trigger a new Actions run instead of re-running this one')

          if status not in ('accepted', 'skipped') or not isinstance(raw_run, str):
              fail(f'Unexpected response{diag_suffix}; inspect existing delivery/run before retrying')
          if multica_run is None:
              fail(f'Invalid run identifier{diag_suffix}; inspect the existing delivery before retrying')

          print(f'Multica admission={status}; run_id={multica_run}' + (f'; {diagnostics}' if diagnostics else ''))
          if status == 'skipped':
              fail(f'Skipped{diag_suffix}: inspect failure_reason in Multica; no completion claimed')
          print('Accepted for dispatch; implementation and review are still unverified')
          PY
